<!DOCTYPE html>
<html lang="uk">
<head>
  <base target="_top">

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#d9001b">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="ARENSIA Travel Desk"
  >

  <title>ARENSIA Travel Desk</title>


  <!-- =====================================================
       ARENSIA ICON
       ===================================================== -->

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="icon.png"
  >

  <link
    rel="apple-touch-icon-precomposed"
    sizes="180x180"
    href="icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="180x180"
    href="icon.png"
  >


  <!-- =====================================================
       PDF.JS
       ===================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
  </script>


  <style>

    :root {
      --green: #123f34;
      --bg: #f5f7f6;
      --card: #ffffff;
      --text: #14231e;
      --muted: #6d7974;
      --line: #dce4e0;
      --warning: #fff0c2;
      --warning-text: #654b00;
      --ready: #177143;
      --red: #d9001b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-width: 0;

      background: var(--bg);
    }

    body {
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      overflow-x: hidden;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body.viewer-open {
      overflow: hidden;
    }


    /* =====================================================
       APP
       ===================================================== */

    .app {
      width: calc(100% - 60px);
      max-width: 1580px;

      margin: 0 auto;

      padding: 45px 0 80px;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      display: flex;
      align-items: center;

      gap: 22px;

      width: 100%;
    }

    .header-logo {
      width: 76px;
      height: 76px;

      flex: 0 0 76px;

      display: block;

      object-fit: cover;

      border-radius: 18px;
    }

    .header-text {
      min-width: 0;
      flex: 1;
    }

    h1 {
      margin: 0;

      font-size: 50px;
      line-height: 1.05;

      font-weight: 800;

      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 8px;

      color: var(--muted);

      font-size: 23px;
      line-height: 1.3;
    }


    /* =====================================================
       FILTERS
       ===================================================== */

    .filters {
      display: flex;
      flex-wrap: wrap;

      gap: 14px;

      width: 100%;

      margin: 35px 0 38px;
    }

    .filter {
      appearance: none;
      -webkit-appearance: none;

      border: 1px solid var(--line);

      background: white;
      color: var(--text);

      border-radius: 999px;

      padding: 15px 24px;

      font-family: inherit;

      font-size: 20px;
      font-weight: 700;

      cursor: pointer;
    }

    .filter.active {
      background: var(--green);
      color: white;

      border-color: var(--green);
    }


    /* =====================================================
       CARDS
       ===================================================== */

    .grid {
      display: block;

      width: 100%;
    }

    .card {
      width: 100%;

      margin: 0 0 28px;

      padding: 40px 44px;

      background: var(--card);

      border: 1px solid var(--line);

      border-radius: 24px;
    }

    .card-top {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      gap: 25px;
    }

    .card-heading {
      min-width: 0;
      flex: 1;
    }


    /* ІМ'Я ПЕРШЕ */

    .people-main {
      font-size: 36px;
      line-height: 1.2;

      font-weight: 800;

      overflow-wrap: anywhere;
    }

    .destination-sub {
      margin-top: 10px;

      font-size: 24px;
      line-height: 1.4;

      font-weight: 400;

      overflow-wrap: anywhere;
    }

    .dates {
      flex: 0 0 auto;

      white-space: nowrap;

      font-size: 22px;
      line-height: 1.3;

      font-weight: 800;
    }

    .purpose {
      margin-top: 7px;

      color: var(--muted);

      font-size: 21px;
      line-height: 1.4;
    }


    /* =====================================================
       ROUTES
       ===================================================== */

    .route {
      display: flex;
      flex-direction: column;

      gap: 17px;

      margin-top: 30px;

      padding-left: 23px;

      border-left: 3px solid #dce7e2;
    }

    .route-row {
      display: flex;
      align-items: flex-start;

      gap: 11px;

      font-size: 24px;
      line-height: 1.45;
    }

    .route-icon {
      width: 32px;

      flex: 0 0 32px;

      text-align: center;

      font-size: 25px;
    }

    .route-content {
      min-width: 0;

      overflow-wrap: anywhere;
    }

    .route-date {
      font-weight: 800;
    }

    .route-number {
      color: var(--muted);
    }


    /* =====================================================
       HOTEL
       ===================================================== */

    .hotel {
      margin-top: 24px;

      font-size: 24px;
      line-height: 1.45;

      overflow-wrap: anywhere;
    }


    /* =====================================================
       READY
       ===================================================== */

    .ready {
      margin-top: 25px;

      color: var(--ready);

      font-size: 23px;
      line-height: 1.4;

      font-weight: 800;
    }


    /* =====================================================
       WARNING
       ===================================================== */

    .warning {
      width: 100%;

      margin-top: 28px;

      padding: 23px 25px;

      background: var(--warning);
      color: var(--warning-text);

      border-radius: 17px;

      font-size: 22px;
      line-height: 1.5;

      overflow-wrap: anywhere;
    }

    .warning-title {
      margin-bottom: 7px;

      font-size: 22px;
      font-weight: 800;
    }

    .deadline {
      margin-top: 9px;

      font-size: 19px;
    }


    /* =====================================================
       BUTTONS
       ===================================================== */

    .buttons {
      display: flex;
      flex-wrap: wrap;

      gap: 12px;

      width: 100%;

      margin-top: 28px;
    }

    .btn {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 58px;

      padding: 14px 20px;

      background: white;
      color: var(--text);

      border: 1px solid var(--line);

      border-radius: 13px;

      text-decoration: none;

      font-family: inherit;

      font-size: 20px;
      line-height: 1.2;

      font-weight: 700;

      cursor: pointer;
    }

    .btn:hover {
      background: #f7f9f8;
    }


    /* =====================================================
       STATES
       ===================================================== */

    .loading,
    .empty,
    .error {
      width: 100%;

      padding: 50px 25px;

      background: white;

      border: 1px solid var(--line);

      border-radius: 22px;

      text-align: center;

      font-size: 20px;
    }

    .error {
      color: #a52a2a;
    }


    /* =====================================================
       DOCUMENT VIEWER
       ===================================================== */

    .viewer {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: none;

      flex-direction: column;

      background: #eef1ef;
    }

    .viewer.open {
      display: flex;
    }

    .viewer-header {
      flex: 0 0 auto;

      display: flex;
      align-items: center;

      gap: 15px;

      min-height: 76px;

      padding:
        calc(12px + env(safe-area-inset-top))
        20px
        12px;

      background: white;

      border-bottom: 1px solid var(--line);
    }

    .viewer-back {
      appearance: none;
      -webkit-appearance: none;

      flex: 0 0 auto;

      border: 0;

      background: transparent;
      color: var(--text);

      padding: 10px;

      font-family: inherit;

      font-size: 20px;
      font-weight: 800;

      cursor: pointer;
    }

    .viewer-title-wrap {
      min-width: 0;

      flex: 1;
    }

    .viewer-title {
      font-size: 20px;
      line-height: 1.2;

      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .viewer-counter {
      margin-top: 3px;

      color: var(--muted);

      font-size: 14px;
    }

    .viewer-navigation {
      flex: 0 0 auto;

      display: flex;

      gap: 7px;
    }

    .viewer-nav-btn {
      appearance: none;
      -webkit-appearance: none;

      width: 42px;
      height: 42px;

      border: 1px solid var(--line);

      background: white;
      color: var(--text);

      border-radius: 10px;

      font-size: 19px;

      cursor: pointer;
    }

    .viewer-nav-btn:disabled {
      opacity: .3;

      cursor: default;
    }


    /* =====================================================
       VIEWER BODY
       ===================================================== */

    .viewer-body {
      position: relative;

      flex: 1;

      min-height: 0;

      overflow: auto;

      background: #dfe4e1;

      -webkit-overflow-scrolling: touch;
    }

    .viewer-loading {
      position: absolute;

      inset: 0;

      z-index: 10;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #f5f7f6;

      text-align: center;

      font-size: 18px;
      font-weight: 600;
    }

    .viewer-error {
      position: absolute;

      inset: 0;

      z-index: 11;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 35px;

      background: #f5f7f6;
      color: #a52a2a;

      text-align: center;

      font-size: 18px;
      line-height: 1.5;
    }


    /* =====================================================
       PDF
       ===================================================== */

    .pdf-area {
      display: none;

      width: 100%;
      min-height: 100%;

      padding: 25px 20px 90px;

      text-align: center;
    }

    .pdf-page-wrapper {
      display: inline-block;

      max-width: 100%;

      background: white;

      box-shadow:
        0 4px 18px
        rgba(0, 0, 0, .13);
    }

    #pdfCanvas {
      display: block;

      max-width: 100%;

      height: auto;
    }

    .pdf-controls {
      position: fixed;

      left: 50%;

      bottom:
        calc(
          18px +
          env(safe-area-inset-bottom)
        );

      z-index: 10001;

      display: none;

      align-items: center;

      gap: 12px;

      transform: translateX(-50%);

      padding: 8px 10px;

      background: rgba(255,255,255,.96);

      border: 1px solid var(--line);

      border-radius: 14px;

      box-shadow:
        0 4px 18px
        rgba(0,0,0,.12);
    }

    .pdf-control-btn {
      appearance: none;
      -webkit-appearance: none;

      width: 42px;
      height: 42px;

      border: 1px solid var(--line);

      background: white;

      border-radius: 10px;

      color: var(--text);

      font-size: 20px;
      font-weight: 700;

      cursor: pointer;
    }

    .pdf-control-btn:disabled {
      opacity: .3;

      cursor: default;
    }

    .pdf-page-info {
      min-width: 82px;

      color: var(--text);

      text-align: center;

      font-size: 15px;
      font-weight: 700;
    }


    /* =====================================================
       IMAGE
       ===================================================== */

    .image-area {
      display: none;

      width: 100%;
      min-height: 100%;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .viewer-image {
      display: block;

      max-width: 100%;
      max-height: calc(100vh - 120px);

      object-fit: contain;

      background: white;

      box-shadow:
        0 4px 18px
        rgba(0,0,0,.13);
    }


    /* =====================================================
       UNSUPPORTED
       ===================================================== */

    .unsupported-area {
      display: none;

      min-height: 100%;

      align-items: center;
      justify-content: center;

      padding: 35px;
    }

    .unsupported-box {
      max-width: 500px;

      padding: 30px;

      background: white;

      border-radius: 18px;

      text-align: center;

      font-size: 17px;
      line-height: 1.5;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media screen and (max-width: 700px) {

      html,
      body {
        width: 100% !important;
        max-width: 100% !important;

        overflow-x: hidden !important;
      }

      .app {
        width: 100% !important;
        max-width: none !important;

        margin: 0 !important;

        padding:
          24px
          16px
          calc(45px + env(safe-area-inset-bottom))
          16px !important;
      }

      .header {
        gap: 12px;
      }

      .header-logo {
        width: 50px;
        height: 50px;

        flex: 0 0 50px;

        border-radius: 12px;
      }

      h1 {
        font-size: 28px;
        line-height: 1.08;

        letter-spacing: -.5px;
      }

      .subtitle {
        margin-top: 5px;

        font-size: 15px;
      }

      .filters {
        flex-wrap: nowrap;

        gap: 8px;

        margin: 22px 0 24px;

        overflow-x: auto;

        -webkit-overflow-scrolling: touch;

        scrollbar-width: none;
      }

      .filters::-webkit-scrollbar {
        display: none;
      }

      .filter {
        flex: 0 0 auto;

        padding: 10px 15px;

        font-size: 14px;
      }

      .card {
        margin: 0 0 17px;

        padding: 23px 20px;

        border-radius: 18px;
      }

      .card-top {
        gap: 10px;
      }

      .people-main {
        font-size: 23px;
        line-height: 1.2;
      }

      .destination-sub {
        margin-top: 7px;

        font-size: 16px;
      }

      .dates {
        font-size: 14px;
      }

      .purpose {
        font-size: 15px;
      }

      .route {
        gap: 11px;

        margin-top: 20px;

        padding-left: 14px;

        border-left-width: 2px;
      }

      .route-row {
        gap: 8px;

        font-size: 16px;
      }

      .route-icon {
        width: 22px;

        flex: 0 0 22px;

        font-size: 17px;
      }

      .hotel {
        margin-top: 18px;

        font-size: 16px;
      }

      .ready {
        margin-top: 18px;

        font-size: 16px;
      }

      .warning {
        margin-top: 19px;

        padding: 14px 15px;

        border-radius: 13px;

        font-size: 15px;
      }

      .warning-title {
        font-size: 15px;
      }

      .deadline {
        margin-top: 8px;

        font-size: 14px;
      }

      .buttons {
        gap: 8px;

        margin-top: 18px;
      }

      .btn {
        min-height: 45px;

        padding: 10px 13px;

        border-radius: 11px;

        font-size: 15px;
      }

      .viewer-header {
        gap: 7px;

        min-height: 64px;

        padding:
          calc(7px + env(safe-area-inset-top))
          8px
          7px;
      }

      .viewer-back {
        padding: 8px 5px;

        font-size: 16px;
      }

      .viewer-title {
        font-size: 16px;
      }

      .viewer-counter {
        font-size: 12px;
      }

      .viewer-navigation {
        gap: 4px;
      }

      .viewer-nav-btn {
        width: 36px;
        height: 36px;

        font-size: 16px;
      }

      .pdf-area {
        padding: 12px 8px 85px;
      }

      .pdf-page-wrapper {
        width: 100%;
      }

      #pdfCanvas {
        width: 100%;

        height: auto;
      }

      .pdf-controls {
        bottom:
          calc(
            10px +
            env(safe-area-inset-bottom)
          );
      }

      .pdf-control-btn {
        width: 38px;
        height: 38px;
      }

      .image-area {
        padding: 10px;
      }
    }


    @media screen and (max-width: 390px) {

      .app {
        padding-left: 12px !important;
        padding-right: 12px !important;
      }

      h1 {
        font-size: 25px;
      }

      .header-logo {
        width: 46px;
        height: 46px;

        flex-basis: 46px;
      }

      .subtitle {
        font-size: 14px;
      }

      .card {
        padding: 20px 17px;
      }

      .people-main {
        font-size: 21px;
      }

      .destination-sub,
      .route-row {
        font-size: 15px;
      }
    }

  </style>

</head>

/* =====================================================
   PDF.JS
   ===================================================== */

if (typeof pdfjsLib !== 'undefined') {

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}




/* =====================================================
   GITHUB API
   ===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbytEs2tay3UuD5LpADN6VOIgbXVX26l8jnz--CB0nIL4q7c6DsYZBJh45CCOXVByMXQ4w/exec';

function jsonp(params) {
  return new Promise(function(resolve, reject) {
    const callbackName = '__arensia_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const query = new URLSearchParams(params || {});
    query.set('callback', callbackName);

    function cleanup() {
      try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(payload) {
      cleanup();
      if (payload && payload.ok === false) {
        reject(new Error(payload.error || 'Помилка API'));
        return;
      }
      resolve(payload && Object.prototype.hasOwnProperty.call(payload, 'data') ? payload.data : payload);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error('Не вдалося підключитися до Apps Script API.'));
    };

    script.src = API_URL + '?' + query.toString();
    document.head.appendChild(script);
  });
}

/* =====================================================
   STATE
   ===================================================== */

let trips = [];

let currentFilter = 'all';

let viewerFiles = [];

let viewerIndex = 0;

let pdfDocument = null;

let pdfPageNumber = 1;

let pdfRendering = false;

let pdfPendingPage = null;

let pdfRenderToken = 0;



/* =====================================================
   LOAD MASTER
   ===================================================== */

jsonp({ api: 'data' })
  .then(function(data) {
    trips = buildTrips(data.trips || [], data.routes || []);
    sortTrips();
    render();
  })
  .catch(function(error) {
    document.getElementById('grid').innerHTML =
      '<div class="error">' +
      'Не вдалося завантажити MASTER.<br>' +
      escapeHtml(error.message || String(error)) +
      '</div>';
  });



/* =====================================================
   HELPERS
   ===================================================== */

function txt(value) {

  return String(
    value || ''
  ).trim();
}


function upper(value) {

  return txt(value)
    .toUpperCase();
}


function unique(values) {

  return [
    ...new Set(
      values
        .map(txt)
        .filter(Boolean)
    )
  ];
}


function validUrl(value) {

  return /^https?:\/\//i
    .test(
      txt(value)
    );
}


function isStatus(value) {

  return [
    'ГОТОВО',
    'ТРЕБА ЗРОБИТИ',
    'ТЕРМІНОВО',
    'ОЧІКУЄМО',
    'НЕ ПОТРІБНО',
    'НЕВІДОМО'
  ].includes(
    upper(value)
  );
}


function clean(value) {

  const v = txt(value);

  if (
    !v ||
    isStatus(v)
  ) {
    return '';
  }

  return v;
}



/* =====================================================
   EMPLOYEE NAME
   ІМ'Я → ПРІЗВИЩЕ
   ===================================================== */

function normalizeEmployeeName(value) {

  const name =
    txt(value)
      .replace(/\s+/g, ' ');


  if (!name) {
    return '';
  }


  const parts =
    name.split(' ');


  if (
    parts.length !== 2
  ) {
    return name;
  }


  const knownFirstNames =
    new Set([

      'Євген',
      'Юлія',
      'Тетяна',
      'Зореслава',
      'Юрій',
      'Мирослава',
      'Дарина',
      'Катерина',

      'Евген',
      'Евгений',
      'Юлия',
      'Татьяна',
      'Юрий',
      'Екатерина'

    ]);


  if (
    knownFirstNames.has(
      parts[0]
    )
  ) {

    return (
      parts[0] +
      ' ' +
      parts[1]
    );
  }


  if (
    knownFirstNames.has(
      parts[1]
    )
  ) {

    return (
      parts[1] +
      ' ' +
      parts[0]
    );
  }


  return name;
}



/* =====================================================
   BUILD TRIPS
   ===================================================== */

function buildTrips(
  tripRows,
  routeRows
) {

  const groups = {};


  tripRows.forEach(
    function(row, index) {

      const tripId =
        txt(row.tripId) ||
        'NO-ID-' + index;


      if (!groups[tripId]) {

        groups[tripId] = [];
      }


      groups[tripId]
        .push(row);
    }
  );


  return Object.keys(groups)
    .map(
      function(tripId) {

        const rows =
          groups[tripId];


        const routes =
          routeRows.filter(
            function(route) {

              return (
                txt(route.tripId) ===
                tripId
              );
            }
          );


        return createTrip(
          tripId,
          rows,
          routes
        );
      }
    );
}



function createTrip(
  tripId,
  rows,
  routes
) {

  const startDates =
    rows
      .map(
        row =>
          parseDate(
            row.startDate
          )
      )
      .filter(Boolean);


  const endDates =
    rows
      .map(
        row =>
          parseDate(
            row.endDate
          ) ||
          parseDate(
            row.startDate
          )
      )
      .filter(Boolean);


  const start =
    startDates.length

      ? new Date(
          Math.min(
            ...startDates.map(
              d => d.getTime()
            )
          )
        )

      : null;


  const end =
    endDates.length

      ? new Date(
          Math.max(
            ...endDates.map(
              d => d.getTime()
            )
          )
        )

      : start;


  return {

    tripId: tripId,

    rows: rows,

    start: start,

    end: end,


    employees:
      unique(
        rows.map(
          row =>
            normalizeEmployeeName(
              row.employee
            )
        )
      ),


    destinations:
      unique(
        rows.map(
          row =>
            clean(
              row.destination
            )
        )
      ),


    purposes:
      unique(
        rows.map(
          row =>
            clean(
              row.purpose
            )
        )
      ),


    hotels:
      unique(
        rows.map(
          row =>
            clean(
              row.hotel
            )
        )
      ),


    tasks:
      unique(
        rows.map(
          row =>
            clean(
              row.task
            )
        )
      ),


    deadlines:
      unique(
        rows.map(
          row =>
            clean(
              row.deadline
            )
        )
      ),


    routes:
      prepareRoutes(
        routes
      ),


    folders:
      unique(
        rows
          .map(
            row =>
              row.driveFolder
          )
          .filter(
            validUrl
          )
      ),


    ticketFiles:
      unique(
        rows
          .map(
            row =>
              row.ticketOutFile
          )
          .concat(
            rows.map(
              row =>
                row.ticketBackFile
            )
          )
          .filter(
            validUrl
          )
      ),


    hotelFiles:
      unique(
        rows
          .map(
            row =>
              row.hotelFile
          )
          .filter(
            validUrl
          )
      ),


    transferFiles:
      unique(
        rows
          .map(
            row =>
              row.transferFile
          )
          .filter(
            validUrl
          )
      ),


    tripFiles:
      unique(
        rows
          .map(
            row =>
              row.tripFile
          )
          .filter(
            validUrl
          )
      )

  };
}



/* =====================================================
   ROUTES
   ===================================================== */

function prepareRoutes(routes) {

  return routes

    .map(
      route => ({
        ...route,

        parsedDate:
          parseDate(
            route.date
          )
      })
    )

    .sort(
      function(a, b) {

        const dateA =
          a.parsedDate
            ? a.parsedDate.getTime()
            : Infinity;


        const dateB =
          b.parsedDate
            ? b.parsedDate.getTime()
            : Infinity;


        if (
          dateA !== dateB
        ) {

          return dateA - dateB;
        }


        return (
          timeToMinutes(
            a.departure
          ) -

          timeToMinutes(
            b.departure
          )
        );
      }
    );
}



function timeToMinutes(value) {

  const match =
    txt(value)
      .match(
        /^(\d{1,2}):(\d{2})$/
      );


  if (!match) {

    return 9999;
  }


  return (
    Number(match[1]) * 60 +
    Number(match[2])
  );
}



function routeIcon(type) {

  switch (
    upper(type)
  ) {

    case 'FLIGHT':
      return '✈️';

    case 'TRAIN':
      return '🚆';

    case 'TRANSFER':
      return '🚘';

    case 'BUS':
      return '🚌';

    default:
      return '📍';
  }
}



/* =====================================================
   STATUS
   ===================================================== */

function needsAttention(trip) {

  if (
    trip.tasks.length
  ) {

    return true;
  }


  return trip.rows.some(
    function(row) {

      const status =
        upper(
          row.status
        );


      return (
        status === 'ТРЕБА ЗРОБИТИ' ||
        status === 'ТЕРМІНОВО' ||
        status === 'ОЧІКУЄМО'
      );
    }
  );
}



function isReady(trip) {

  if (
    needsAttention(trip)
  ) {

    return false;
  }


  const statuses =
    trip.rows
      .map(
        row =>
          upper(
            row.status
          )
      )
      .filter(Boolean);


  if (
    !statuses.length
  ) {

    return false;
  }


  return statuses.every(
    function(status) {

      return (
        status === 'ГОТОВО' ||
        status === 'НЕ ПОТРІБНО'
      );
    }
  );
}



/* =====================================================
   SORT
   ===================================================== */

function sortTrips() {

  trips.sort(
    function(a, b) {

      const aDate =
        a.start
          ? a.start.getTime()
          : Infinity;


      const bDate =
        b.start
          ? b.start.getTime()
          : Infinity;


      return aDate - bDate;
    }
  );
}



/* =====================================================
   RENDER
   ===================================================== */

function render() {

  let visible =
    trips;


  if (
    currentFilter ===
    'attention'
  ) {

    visible =
      trips.filter(
        needsAttention
      );
  }


  if (
    currentFilter ===
    'ready'
  ) {

    visible =
      trips.filter(
        isReady
      );
  }


  const grid =
    document
      .getElementById(
        'grid'
      );


  if (
    !visible.length
  ) {

    grid.innerHTML =
      '<div class="empty">' +
      'У цьому розділі немає відряджень.' +
      '</div>';

    return;
  }


  grid.innerHTML =
    visible
      .map(
        renderCard
      )
      .join('');
}



/* =====================================================
   CARD
   ===================================================== */

function renderCard(trip) {

  const destination =
    trip.destinations.length

      ? trip.destinations.join(' → ')

      : 'Напрямок не вказаний';


  const people =
    trip.employees.length

      ? trip.employees.join(' · ')

      : 'Співробітник не вказаний';


  return `

    <article class="card">

      <div class="card-top">

        <div class="card-heading">

          <div class="people-main">
            ${escapeHtml(people)}
          </div>


          <div class="destination-sub">
            ${escapeHtml(destination)}
          </div>


          ${
            trip.purposes.length

              ? `
                <div class="purpose">

                  ${
                    escapeHtml(
                      trip.purposes.join(' · ')
                    )
                  }

                </div>
              `

              : ''
          }

        </div>


        <div class="dates">

          ${
            escapeHtml(
              formatRange(
                trip.start,
                trip.end
              )
            )
          }

        </div>

      </div>


      ${renderRoutes(trip)}

      ${renderHotel(trip)}


      ${
        isReady(trip)

          ? `
            <div class="ready">
              ✓ Відрядження підготовлено
            </div>
          `

          : ''
      }


      ${renderTasks(trip)}

      ${renderButtons(trip)}

    </article>
  `;
}



/* =====================================================
   ROUTES DISPLAY
   ===================================================== */

function renderRoutes(trip) {

  if (
    !trip.routes.length
  ) {

    return '';
  }


  return `

    <div class="route">

      ${
        trip.routes
          .map(
            function(route) {

              const date =
                route.parsedDate

                  ? shortDate(
                      route.parsedDate
                    )

                  : '';


              let time = '';


              if (
                txt(
                  route.departure
                )
              ) {

                time +=
                  txt(
                    route.departure
                  );
              }


              if (
                txt(
                  route.arrival
                )
              ) {

                time +=
                  '–' +
                  txt(
                    route.arrival
                  );
              }


              let places = '';


              if (
                txt(route.from) &&
                txt(route.to)
              ) {

                places =
                  txt(route.from) +
                  ' → ' +
                  txt(route.to);

              } else {

                places =
                  txt(route.from) ||
                  txt(route.to);
              }


              return `

                <div class="route-row">

                  <div class="route-icon">

                    ${
                      routeIcon(
                        route.type
                      )
                    }

                  </div>


                  <div class="route-content">

                    ${
                      date

                        ? `
                          <span class="route-date">
                            ${escapeHtml(date)}
                          </span>
                          ·
                        `

                        : ''
                    }


                    ${
                      time

                        ? escapeHtml(time) +
                          ' · '

                        : ''
                    }


                    ${escapeHtml(places)}


                    ${
                      txt(route.number)

                        ? `
                          <span class="route-number">

                            · ${
                              escapeHtml(
                                route.number
                              )
                            }

                          </span>
                        `

                        : ''
                    }

                  </div>

                </div>
              `;
            }
          )
          .join('')
      }

    </div>
  `;
}



/* =====================================================
   HOTEL
   ===================================================== */

function renderHotel(trip) {

  if (
    !trip.hotels.length
  ) {

    return '';
  }


  return `

    <div class="hotel">

      ${
        trip.hotels
          .map(
            hotel =>
              '🏨 ' +
              escapeHtml(hotel)
          )
          .join('<br>')
      }

    </div>
  `;
}



/* =====================================================
   TASKS
   ===================================================== */

function renderTasks(trip) {

  if (
    !trip.tasks.length
  ) {

    return '';
  }


  let html = `

    <div class="warning">

      <div class="warning-title">
        ⚠️ Треба зробити:
      </div>

      ${
        trip.tasks
          .map(
            escapeHtml
          )
          .join('<br>')
      }
  `;


  if (
    trip.deadlines.length
  ) {

    html += `

      <div class="deadline">

        Дедлайн:

        ${
          trip.deadlines
            .map(
              escapeHtml
            )
            .join(' · ')
        }

      </div>
    `;
  }


  html +=
    '</div>';


  return html;
}



/* =====================================================
   BUTTONS
   ===================================================== */

function renderButtons(trip) {

  let html = '';


  if (
    trip.folders.length
  ) {

    html += `

      <a
        class="btn"
        href="${
          escapeHtml(
            trip.folders[0]
          )
        }"
        target="_blank"
        rel="noopener noreferrer"
      >
        📁 Всі файли
      </a>
    `;
  }


  if (
    trip.ticketFiles.length
  ) {

    html +=
      viewerButton(
        trip.ticketFiles,
        '🎫 Квитки'
      );
  }


  if (
    trip.hotelFiles.length
  ) {

    html +=
      viewerButton(
        trip.hotelFiles,
        '🏨 Готель'
      );
  }


  if (
    trip.transferFiles.length
  ) {

    html +=
      viewerButton(
        trip.transferFiles,
        '🚘 Трансфер'
      );
  }


  if (
    trip.tripFiles.length
  ) {

    html +=
      viewerButton(
        trip.tripFiles,
        '📄 Документи'
      );
  }


  if (
    !html
  ) {

    return '';
  }


  return `

    <div class="buttons">

      ${html}

    </div>
  `;
}



function viewerButton(
  files,
  label
) {

  const encoded =
    encodeURIComponent(
      JSON.stringify(
        files
      )
    );


  return `

    <button
      type="button"
      class="btn"
      data-files="${escapeHtml(encoded)}"
      data-title="${escapeHtml(label)}"
      onclick="openViewerFromButton(this)"
    >
      ${escapeHtml(label)}
    </button>
  `;
}



/* =====================================================
   OPEN VIEWER
   ===================================================== */

function openViewerFromButton(button) {

  try {

    viewerFiles =
      JSON.parse(
        decodeURIComponent(
          button.dataset.files
        )
      );

  } catch (error) {

    viewerFiles = [];
  }


  if (
    !viewerFiles.length
  ) {

    return;
  }


  viewerIndex = 0;


  document
    .getElementById(
      'viewer'
    )
    .classList
    .add(
      'open'
    );


  document
    .body
    .classList
    .add(
      'viewer-open'
    );


  loadViewerFile();
}



/* =====================================================
   LOAD DOCUMENT
   ===================================================== */

function loadViewerFile() {

  if (
    !viewerFiles.length
  ) {

    return;
  }


  resetViewerContent();


  const url =
    viewerFiles[
      viewerIndex
    ];


  updateViewerNavigation();


  jsonp({ api: 'file', url: url })
    .then(function(file) {
      document.getElementById('viewerTitle').textContent = file.name || 'Документ';
      const mimeType = String(file.mimeType || '').toLowerCase();

      try {
        if (mimeType === 'application/pdf' || String(file.name || '').toLowerCase().endsWith('.pdf')) {
          showPdf(file.base64);
          return;
        }

        if (mimeType.startsWith('image/')) {
          showImage(file.base64, mimeType);
          return;
        }

        showUnsupported(file.name);
      } catch (error) {
        showViewerError(error.message || String(error));
      }
    })
    .catch(function(error) {
      showViewerError(error.message || String(error));
    });
}



/* =====================================================
   RESET VIEWER
   ===================================================== */

function resetViewerContent() {

  pdfRenderToken++;


  pdfDocument = null;

  pdfPageNumber = 1;

  pdfRendering = false;

  pdfPendingPage = null;


  document
    .getElementById(
      'viewerLoading'
    )
    .style.display =
      'flex';


  const errorBox =
    document
      .getElementById(
        'viewerError'
      );


  errorBox.style.display =
    'none';


  errorBox.textContent =
    '';


  document
    .getElementById(
      'pdfArea'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'pdfControls'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'imageArea'
    )
    .style.display =
      'none';


  const image =
    document
      .getElementById(
        'viewerImage'
      );


  image.removeAttribute(
    'src'
  );


  document
    .getElementById(
      'unsupportedArea'
    )
    .style.display =
      'none';


  const canvas =
    document
      .getElementById(
        'pdfCanvas'
      );


  const context =
    canvas.getContext(
      '2d'
    );


  context.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  canvas.width = 1;

  canvas.height = 1;
}



/* =====================================================
   PDF
   ===================================================== */

async function showPdf(base64) {

  if (
    typeof pdfjsLib ===
    'undefined'
  ) {

    showViewerError(
      'Не вдалося завантажити модуль перегляду PDF.'
    );

    return;
  }


  const token =
    ++pdfRenderToken;


  try {

    const bytes =
      base64ToUint8Array(
        base64
      );


    const loadingTask =
      pdfjsLib.getDocument({
        data: bytes
      });


    const documentObject =
      await loadingTask.promise;


    if (
      token !==
      pdfRenderToken
    ) {

      return;
    }


    pdfDocument =
      documentObject;


    pdfPageNumber = 1;


    document
      .getElementById(
        'viewerLoading'
      )
      .style.display =
        'none';


    document
      .getElementById(
        'pdfArea'
      )
      .style.display =
        'block';


    if (
      pdfDocument.numPages > 1
    ) {

      document
        .getElementById(
          'pdfControls'
        )
        .style.display =
          'flex';
    }


    updatePdfControls();


    await renderPdfPage(
      pdfPageNumber,
      token
    );

  } catch (error) {

    showViewerError(
      'Не вдалося відобразити PDF. ' +
      (
        error.message ||
        String(error)
      )
    );
  }
}



/* =====================================================
   PDF PAGE
   ===================================================== */

async function renderPdfPage(
  pageNumber,
  token
) {

  if (
    !pdfDocument
  ) {

    return;
  }


  if (
    pdfRendering
  ) {

    pdfPendingPage =
      pageNumber;

    return;
  }


  pdfRendering =
    true;


  try {

    const page =
      await pdfDocument
        .getPage(
          pageNumber
        );


    if (
      token !==
      pdfRenderToken
    ) {

      pdfRendering =
        false;

      return;
    }


    const canvas =
      document
        .getElementById(
          'pdfCanvas'
        );


    const context =
      canvas.getContext(
        '2d'
      );


    const naturalViewport =
      page.getViewport({
        scale: 1
      });


    const bodyWidth =
      document
        .getElementById(
          'viewerBody'
        )
        .clientWidth;


    const maxWidth =
      Math.max(
        280,
        Math.min(
          bodyWidth - 40,
          1100
        )
      );


    const cssScale =
      Math.min(
        maxWidth /
        naturalViewport.width,
        1.8
      );


    const deviceScale =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    const renderScale =
      cssScale *
      deviceScale;


    const renderViewport =
      page.getViewport({
        scale: renderScale
      });


    const cssViewport =
      page.getViewport({
        scale: cssScale
      });


    canvas.width =
      Math.floor(
        renderViewport.width
      );


    canvas.height =
      Math.floor(
        renderViewport.height
      );


    canvas.style.width =
      Math.floor(
        cssViewport.width
      ) + 'px';


    canvas.style.height =
      Math.floor(
        cssViewport.height
      ) + 'px';


    await page.render({

      canvasContext:
        context,

      viewport:
        renderViewport

    }).promise;


    if (
      token !==
      pdfRenderToken
    ) {

      pdfRendering =
        false;

      return;
    }


    pdfPageNumber =
      pageNumber;


    updatePdfControls();


    document
      .getElementById(
        'viewerBody'
      )
      .scrollTop = 0;

  } catch (error) {

    showViewerError(
      'Не вдалося відобразити сторінку PDF. ' +
      (
        error.message ||
        String(error)
      )
    );

  } finally {

    pdfRendering =
      false;


    if (
      pdfPendingPage !== null
    ) {

      const pending =
        pdfPendingPage;


      pdfPendingPage =
        null;


      renderPdfPage(
        pending,
        token
      );
    }
  }
}



/* =====================================================
   PDF CONTROLS
   ===================================================== */

function updatePdfControls() {

  const total =
    pdfDocument
      ? pdfDocument.numPages
      : 1;


  document
    .getElementById(
      'pdfPageInfo'
    )
    .textContent =
      pdfPageNumber +
      ' / ' +
      total;


  document
    .getElementById(
      'pdfPrev'
    )
    .disabled =
      pdfPageNumber <= 1;


  document
    .getElementById(
      'pdfNext'
    )
    .disabled =
      pdfPageNumber >= total;
}



function previousPdfPage() {

  if (
    !pdfDocument ||
    pdfPageNumber <= 1
  ) {

    return;
  }


  renderPdfPage(
    pdfPageNumber - 1,
    pdfRenderToken
  );
}



function nextPdfPage() {

  if (
    !pdfDocument ||
    pdfPageNumber >=
      pdfDocument.numPages
  ) {

    return;
  }


  renderPdfPage(
    pdfPageNumber + 1,
    pdfRenderToken
  );
}



/* =====================================================
   IMAGE
   ===================================================== */

function showImage(
  base64,
  mimeType
) {

  document
    .getElementById(
      'viewerLoading'
    )
    .style.display =
      'none';


  const imageArea =
    document
      .getElementById(
        'imageArea'
      );


  const image =
    document
      .getElementById(
        'viewerImage'
      );


  image.src =
    'data:' +
    mimeType +
    ';base64,' +
    base64;


  imageArea.style.display =
    'flex';
}



/* =====================================================
   UNSUPPORTED
   ===================================================== */

function showUnsupported(
  fileName
) {

  document
    .getElementById(
      'viewerLoading'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'unsupportedBox'
    )
    .textContent =
      'Файл «' +
      (
        fileName ||
        'Документ'
      ) +
      '» має формат, який поки не можна показати всередині Travel Desk.';


  document
    .getElementById(
      'unsupportedArea'
    )
    .style.display =
      'flex';
}



/* =====================================================
   ERROR
   ===================================================== */

function showViewerError(
  message
) {

  document
    .getElementById(
      'viewerLoading'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'pdfControls'
    )
    .style.display =
      'none';


  const errorBox =
    document
      .getElementById(
        'viewerError'
      );


  errorBox.textContent =
    'Не вдалося відкрити документ. ' +
    message;


  errorBox.style.display =
    'flex';
}



/* =====================================================
   DOCUMENT NAVIGATION
   ===================================================== */

function updateViewerNavigation() {

  const counter =
    document
      .getElementById(
        'viewerCounter'
      );


  const prev =
    document
      .getElementById(
        'viewerPrev'
      );


  const next =
    document
      .getElementById(
        'viewerNext'
      );


  if (
    viewerFiles.length > 1
  ) {

    counter.textContent =
      'Документ ' +
      (viewerIndex + 1) +
      ' з ' +
      viewerFiles.length;

  } else {

    counter.textContent =
      '';
  }


  prev.disabled =
    viewerIndex <= 0;


  next.disabled =
    viewerIndex >=
    viewerFiles.length - 1;


  document
    .getElementById(
      'viewerNavigation'
    )
    .style.display =
      viewerFiles.length > 1
        ? 'flex'
        : 'none';
}



function previousViewerFile() {

  if (
    viewerIndex <= 0
  ) {

    return;
  }


  viewerIndex--;

  loadViewerFile();
}



function nextViewerFile() {

  if (
    viewerIndex >=
    viewerFiles.length - 1
  ) {

    return;
  }


  viewerIndex++;

  loadViewerFile();
}



/* =====================================================
   CLOSE VIEWER
   ===================================================== */

function closeViewer() {

  pdfRenderToken++;


  pdfDocument = null;

  pdfPageNumber = 1;

  pdfRendering = false;

  pdfPendingPage = null;


  document
    .getElementById(
      'viewer'
    )
    .classList
    .remove(
      'open'
    );


  document
    .body
    .classList
    .remove(
      'viewer-open'
    );


  document
    .getElementById(
      'pdfControls'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'viewerImage'
    )
    .removeAttribute(
      'src'
    );


  viewerFiles = [];

  viewerIndex = 0;
}



/* =====================================================
   BASE64
   ===================================================== */

function base64ToUint8Array(
  base64
) {

  const binary =
    atob(
      base64
    );


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);
  }


  return bytes;
}



/* =====================================================
   DATES
   ===================================================== */

function parseDate(value) {

  const v =
    txt(value);


  if (
    !v
  ) {

    return null;
  }


  let match =
    v.match(
      /^(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4})/
    );


  if (
    match
  ) {

    return new Date(
      Number(match[3]),
      Number(match[2]) - 1,
      Number(match[1])
    );
  }


  match =
    v.match(
      /^(\d{4})-(\d{1,2})-(\d{1,2})/
    );


  if (
    match
  ) {

    return new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3])
    );
  }


  return null;
}



function dateKey(date) {

  if (
    !date
  ) {

    return '';
  }


  return (
    date.getFullYear() +
    '-' +

    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    ) +

    '-' +

    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    )
  );
}



function shortDate(date) {

  return (
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    ) +

    '.' +

    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    )
  );
}



function formatRange(
  start,
  end
) {

  if (
    !start &&
    !end
  ) {

    return '';
  }


  if (
    start &&
    !end
  ) {

    return shortDate(
      start
    );
  }


  if (
    !start &&
    end
  ) {

    return shortDate(
      end
    );
  }


  if (
    dateKey(start) ===
    dateKey(end)
  ) {

    return shortDate(
      start
    );
  }


  if (
    start.getFullYear() ===
      end.getFullYear() &&

    start.getMonth() ===
      end.getMonth()
  ) {

    return (
      String(
        start.getDate()
      ).padStart(
        2,
        '0'
      ) +

      '–' +

      shortDate(
        end
      )
    );
  }


  return (
    shortDate(start) +
    '–' +
    shortDate(end)
  );
}



/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

  return String(
    value ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );
}



/* =====================================================
   FILTERS
   ===================================================== */

document
  .querySelectorAll(
    '.filter'
  )
  .forEach(
    function(button) {

      button
        .addEventListener(
          'click',
          function() {

            document
              .querySelectorAll(
                '.filter'
              )
              .forEach(
                function(item) {

                  item
                    .classList
                    .remove(
                      'active'
                    );
                }
              );


            button
              .classList
              .add(
                'active'
              );


            currentFilter =
              button
                .dataset
                .filter;


            render();
          }
        );
    }
  );



/* =====================================================
   RESIZE PDF
   ===================================================== */

let resizeTimer = null;


window.addEventListener(
  'resize',
  function() {

    if (
      !pdfDocument
    ) {

      return;
    }


    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function() {

          renderPdfPage(
            pdfPageNumber,
            pdfRenderToken
          );

        },
        250
      );
  }
);

</script>
